name: Build Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package --file WSMP-SimpleSell/pom.xml

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: WSMP-SimpleSell-jar
          path: WSMP-SimpleSell/target/WSMP-SimpleSell.jar
